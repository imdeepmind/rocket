name: ROSS

on:
  push:
    branches: [main, develop]
    paths:
      - 'ross/**'
      - '!ross/docs/**'
      - '.github/workflows/ross.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ross/**'
      - '!ross/docs/**'
      - '.github/workflows/ross.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ross/package-lock.json
      - name: Install dependencies
        working-directory: ross
        run: npm ci
      - name: Lint
        working-directory: ross
        run: npm run lint:check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ross/package-lock.json
      - name: Install dependencies
        working-directory: ross
        run: npm ci
      - name: Type check
        working-directory: ross
        run: npm run compile
  
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ross/package-lock.json
      - name: Install dependencies
        working-directory: ross
        run: npm ci
      - name: Test
        working-directory: ross
        run: npm run coverage
